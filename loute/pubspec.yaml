name: loute
description: "LOUTE - Autonomous Bug Bounty Framework"
publish_to: 'none'
version: 1.5.5+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0
  flutter_riverpod: ^2.6.1
  flutter_rust_bridge: 2.12.0
  file_selector: ^1.0.3
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  webview_flutter: ^4.13.1
  window_manager: ^0.4.3
  url_launcher: ^6.3.1
  font_awesome_flutter: ^11.0.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/capabilities/
